---
layout: default
title: Home
---

<h2>Posts</h2>

<ul class="post-list">
  {% for post in site.posts %}
    <li>
      <span class="post-date">
        {{ post.date | date: "%b %d, %Y" }}
      </span>
      <a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a>
    </li>
  {% endfor %}
</ul>
